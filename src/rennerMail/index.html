<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <meta
        name="theme-color"
        content="#121414"
    >

    <meta
        name="description"
        content="Want to send Renner a message? Drop it here!"
    >

    <title>Renner Mailer!</title>

    <link rel="stylesheet" href="other.css">
    <script src="main.js" defer></script>
</head>

<body>
    <main class="page">
        <section class="mailer" aria-labelledby="title">

            <div class="profile">
                <img
                    src="pfp.jpg"
                    alt="Renner's profile picture"
                    id="pfp"
                    width="114"
                    height="114"
                >
            </div>

            <div class="intro">

                <h1 id="title">
                    Want to send me a message? Send it here!
                </h1>

                <p class="privacy-note">
                    I swear it's anonymous ;D
                </p>
            </div>

            <form id="messageForm">
                <div class="field">
                    <label for="name">
                        Your name
                        <span class="optional">(optional)</span>
                    </label>

                    <input
                        type="text"
                        id="name"
                        name="name"
                        placeholder="Who is this?"
                        maxlength="50"
                        autocomplete="nickname"
                    >
                </div>

                <div class="field">
                    <label for="message">
                        Your message
                    </label>

                    <div class="grow-wrap">
                        <textarea
                            name="text"
                            id="message"
                            rows="4"
                            maxlength="1000"
                            placeholder="What's on your mind?"
                            required
                        ></textarea>
                    </div>

                    <div class="field-footer">
                        <span
                            class="character-count"
                            id="characterCount"
                            aria-live="polite"
                        >0 / 1000</span>
                    </div>
                </div>

                <button
                    class="button"
                    id="sendButton"
                    type="submit"
                >
                    <span id="buttonText">Send message</span>

                    <span class="button-arrow" aria-hidden="true">
                        ↗
                    </span>
                </button>

                <p
                    class="status"
                    id="status"
                    role="status"
                    aria-live="polite"
                    aria-atomic="true"
                ></p>
            </form>

            <details class="settings">
                <summary>Keyboard shortcuts</summary>

                <div class="settings-content">
                    <label class="toggle">
                        <input
                            type="checkbox"
                            id="expertMode"
                            name="expertMode"
                        >

                        <span>Expert mode</span>
                    </label>

                    <p id="shortcutDescription">
                        <kbd>Ctrl</kbd> + <kbd>Enter</kbd>
                        to send your message.
                    </p>
                </div>
            </details>
        </section>
    </main>
</body>
</html>
