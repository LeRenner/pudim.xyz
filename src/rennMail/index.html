<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#ffd74d">
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:site" content="@NotRenner">
    <meta name="twitter:title" content="Renn Mailer!">
    <meta name="twitter:description" content="Want to send me an anonymous message? Send it Here!">
    <meta name="twitter:image" content="https://pudim.xyz/rennMail/nysu.jpg">
    <title>Renn Mailer!</title>
    <link rel="stylesheet" href="../rennerMail/other.css">
    <link rel="stylesheet" href="other.css">
    <script src="../rennerMail/main.js" defer></script>
</head>

<body>
    <main class="page">
        <section class="mailer" aria-labelledby="title">
            <div class="profile">
                <img src="nysu.jpg" alt="Renn!" id="pfp" width="114" height="114">
            </div>

            <header class="intro">
                <h1 id="title">Hey hey hey hey</h1>
                <p>Want to send me a message? Send it here!</p>
                <p class="privacy-note">I swear it is anonymous ;)</p>
            </header>

            <form id="messageForm">
                <input
                    type="text"
                    id="name"
                    name="name"
                    aria-label="Your name (optional)"
                    placeholder="Who is this? (Optional)"
                    maxlength="50"
                    autocomplete="nickname"
                >

                <div class="grow-wrap">
                    <textarea
                        name="text"
                        id="message"
                        aria-label="Your message"
                        placeholder="What do you want to say?"
                        rows="4"
                        maxlength="1000"
                        required
                    ></textarea>
                </div>

                <button class="button" id="sendButton" type="submit">
                    <span id="buttonText">Send!</span>
                </button>

                <p class="status" id="status" role="status" aria-atomic="true"></p>
            </form>

            <div hidden>
                <label for="expertMode">
                    <input type="checkbox" id="expertMode" name="expertMode">
                    Expert Mode
                </label>
                <p id="shortcutDescription"></p>
            </div>
        </section>
    </main>
</body>
</html>
